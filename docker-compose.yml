version: '3'

services:
  nopu:
    image: etzba/nopu:latest
    environment:
      - RELEASE_STAGE=testing
      - PORT=5000
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
